<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Wrapped page</title></head>
<body>
  <!-- Planted problems, modelled on mygov.in, vtu.ac.in and craigslist.org: the whole page sits in one wrapper with
       its header and footer, a carousel arrow is hidden with role="presentation", two div "buttons" have no name
       (one has an icon class, one has no clue at all), and a second block is named "footer". -->
  <div id="page">
    <header><p>Site name</p></header>
    <div id="content">
      <h1>Welcome</h1>
      <p>Main text here.</p>
      <button type="button" role="presentation" class="owl-prev"><span class="icon-left"></span></button>
      <div role="button" tabindex="0" class="bi bi-share"></div>
      <div role="button" tabindex="0" class="marker"></div>
    </div>
    <footer><p>Footer text</p></footer>
  </div>
  <div class="site-footer"><p>More footer</p></div>
</body>
</html>
